<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Resume Analysis History</title>
<link rel="stylesheet" href="history-style.css">
</head>

<body>

<div class="container">


<div class="header">
    <h1>🚀 Resume Analysis History</h1>
    <p>AI Powered ATS Resume Analyzer Dashboard</p>
</div>

<table id="historyTable">

    <thead>
        <tr>
            <th>Select</th>
            <th>ID</th>
            <th>File Name</th>
            <th>Score</th>
            <th>Matched Skills</th>
            <th>Missing Skills</th>
            <th>Suggestions</th>
            <th>Uploaded Date</th>
        </tr>
    </thead>

    <tbody id="historyBody">

    </tbody>

</table>

<div style="text-align:center;margin-top:25px;">
    <button onclick="deleteSelected()">
        🗑 Delete Selected
    </button>
</div>


</div>

<script src="history.js"></script>

</body>
</html>
